[workspace]
members = ["crates/openstar-core", "crates/openstar-cli", "crates/openstar-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.37"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/harryrberg/openstar"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
