name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve pinned toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --workspace --locked
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Set up .NET SDK for MSI build
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.100
      - name: Build MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Validate and test MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'openstar-desktop' | Select-Object -ExpandProperty version
          $msi = "./releases/windows/OpenStar-Prototype-$version-x64.msi"
          ./target/tools/wix/wix.exe msi validate $msi -sice ICE91
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/windows/test.ps1 -MsiPath $msi
      - name: Keep MSI build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openstar-prototype-msi
          path: releases/windows/OpenStar-Prototype-*.msi
